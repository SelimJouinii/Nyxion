name: Test Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from the self-hosted runner!"

      - name: Check Docker is available
        run: docker --version

      - name: Show current directory
        run: pwd && ls -la